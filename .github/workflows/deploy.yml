name: Train models and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  train:
    runs-on: ubuntu-latest
    container: tensorflow/tensorflow:2.20.0
    steps:
      - uses: actions/checkout@v4
      - name: Train and export results
        run: python mnist/mnist_mlp.py --min-acc 0.96 --compare 32,512 --export mnist/data
      - name: Train drowsiness eye CNN
        run: |
          pip install -q pyarrow pandas pillow
          python drowsy/drowsy_cnn.py --min-acc 0.9 --export drowsy/data
      - uses: actions/upload-artifact@v4
        with:
          name: model-data
          path: |
            mnist/data
            drowsy/data

  deploy:
    needs: train
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: model-data
          path: .
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
