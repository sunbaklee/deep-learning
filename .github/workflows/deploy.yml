name: Train MNIST and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  train:
    runs-on: ubuntu-latest
    container: tensorflow/tensorflow:2.20.0
    steps:
      - uses: actions/checkout@v4
      - name: Train and export results
        run: python mnist/mnist_mlp.py --min-acc 0.96 --compare 32,512 --export mnist/data
      - uses: actions/upload-artifact@v4
        with:
          name: mnist-data
          path: mnist/data

  deploy:
    needs: train
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mnist-data
          path: mnist/data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
