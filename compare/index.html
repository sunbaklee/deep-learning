<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>은닉층 크기 비교</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<style>
:root {
  --bg: #F3F5F7; --panel: #FFFFFF; --ink: #17212B; --muted: #5A6774; --rule: #E1E6EB;
  --control: #8A96A3; --hover: #F6F8FA;
  --blue: #1D6AAE; --blue-soft: #EAF2FA;
  --orange: #D55E00; --orange-text: #A44900;
  --violet: #6E43A6; --ok: #2E7D5B; --ok-soft: #E9F4EE; --warn: #B3261E;
  --sans: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.6 var(--sans); font-feature-settings: 'tnum'; }
::selection { background: var(--blue-soft); color: var(--ink); }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 4px; }
a { color: var(--blue); text-underline-offset: 3px; }
code { font: 600 12.5px/1 var(--sans); background: var(--hover); border: 1px solid var(--rule); border-radius: 4px; padding: 2px 5px; }

.topbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 16px;
  height: 60px; padding: 0 20px; background: var(--panel); border-bottom: 1px solid var(--rule); }
.topbar h1 { font-size: 16px; font-weight: 700; margin: 0; white-space: nowrap; }
.topbar .meta { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .spacer { flex: 1; }
.btn { font: 600 13px/1 var(--sans); display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px;
  border-radius: 7px; border: 1px solid var(--control); background: var(--panel); color: var(--ink); cursor: pointer;
  text-decoration: none; white-space: nowrap; transition: background-color .15s ease-out; }
.btn:hover { background: var(--hover); }
.btn.ghost { border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); }
.btn svg { width: 16px; height: 16px; flex: none; }

.main { max-width: 1200px; margin: 0 auto; padding: 28px 16px 16px; display: grid; gap: 16px; }
.intro h2 { font-size: 26px; line-height: 1.3; letter-spacing: -0.02em; margin: 0 0 8px; }
.intro p { margin: 0; color: var(--muted); max-width: 72ch; font-size: 14.5px; }
.panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 16px 18px; min-width: 0; }
.panel h2 { font-size: 15px; font-weight: 700; margin: 0; }
.panel h3 { font-size: 13px; font-weight: 700; margin: 0 0 6px; }
.sub { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }

/* 모델 카드 */
.models { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.model { border-top: 4px solid var(--c); }
.model .tag { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.model .tag h2 { font-size: 16px; }
.model .tag span { font-size: 11.5px; font-weight: 700; color: var(--blue); background: var(--blue-soft); border-radius: 999px; padding: 2px 9px; }
.model .acc { font: 800 34px/1.2 var(--sans); letter-spacing: -0.02em; color: var(--c); margin-top: 8px; }
.model .acc small { font-size: 13px; font-weight: 600; color: var(--muted); margin-left: 6px; letter-spacing: 0; }
.model dl { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin: 12px 0 0; border-top: 1px solid var(--rule); padding-top: 10px; }
.model dt { font-size: 12px; color: var(--muted); font-weight: 600; }
.model dd { margin: 0; font-size: 15px; font-weight: 700; }

/* 증가 구간 표 */
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { padding: 9px 12px; border-bottom: 1px solid var(--rule); text-align: left; white-space: nowrap; }
td.num, th.num { text-align: right; }
thead th { color: var(--muted); font-weight: 600; font-size: 12px; }
tbody tr:last-child td { border-bottom: 0; }
.scroll-x { overflow-x: auto; }
.gain { font-weight: 800; }
.gain.up { color: var(--ok); } .gain.flat { color: var(--muted); } .gain.down { color: var(--warn); }
.takeaway { margin: 14px 0 0; font-size: 14px; }

/* 차트 */
.charts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.chart svg { width: 100%; height: 190px; display: block; overflow: visible; margin-top: 6px; }
.chart text { font: 11px var(--sans); fill: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 16px; height: 0; border-top: 3px solid currentColor; }
.legend b { color: var(--ink); font-weight: 500; }

.state { padding: 40px; text-align: center; color: var(--muted); }
.state.err { color: var(--warn); }
footer { max-width: 1200px; margin: 0 auto; padding: 8px 18px 40px; color: var(--muted); font-size: 12.5px; }

@media (max-width: 860px) {
  .charts { grid-template-columns: 1fr; }
  .topbar .meta { display: none; }
  .intro h2 { font-size: 22px; }
}
@media (max-width: 560px) {
  .topbar { gap: 8px; padding: 0 12px; }
  .topbar .hide-sm { display: none; }
}
@media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></symbol>
  <symbol id="i-run" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-pen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1 11-11-3-3L5 16z"/></symbol>
</svg>

<header class="topbar">
  <a class="btn ghost" href="../" aria-label="딥러닝 실습 메인으로"><svg><use href="#i-back"/></svg><span class="hide-sm">딥러닝 실습</span></a>
  <h1>은닉층 크기 비교</h1>
  <span class="meta" id="meta">MNIST 완전연결 신경망</span>
  <span class="spacer"></span>
  <a class="btn" href="../mnist/"><svg><use href="#i-pen"/></svg>MNIST 실습</a>
  <a class="btn hide-sm" id="run-link" href="https://github.com/sunbaklee/deep-learning/actions" target="_blank" rel="noopener"><svg><use href="#i-run"/></svg>학습 기록</a>
</header>

<main class="main" id="app">
  <section class="intro">
    <h2>은닉층 뉴런을 늘리면 얼마나 좋아질까</h2>
    <p>MNIST 실습의 신경망(784 → 은닉층 → 10)에서 은닉층 뉴런 수만 바꾸고, 에폭·배치 크기·검증 비율·시드는 그대로 두고 GitHub Actions에서 함께 학습한 결과입니다.</p>
  </section>
  <div class="panel state" id="state">학습 결과를 불러오는 중입니다…</div>
</main>
<footer id="foot"></footer>

<template id="tpl">
  <section class="models" id="models" aria-label="모델별 결과"></section>

  <section class="panel" aria-labelledby="gain-h">
    <h2 id="gain-h">늘린 만큼 좋아졌는지</h2>
    <p class="sub">뉴런 수를 한 단계씩 늘릴 때 파라미터, 학습 시간, 테스트 정확도가 얼마나 바뀌었는지 비교합니다.</p>
    <div class="scroll-x" style="margin-top:10px">
      <table>
        <thead><tr><th>은닉층 뉴런</th><th class="num">파라미터</th><th class="num">학습 시간</th><th class="num">테스트 정확도</th><th class="num">틀린 이미지</th></tr></thead>
        <tbody id="gain-rows"></tbody>
      </table>
    </div>
    <p class="takeaway" id="takeaway"></p>
  </section>

  <section class="panel" aria-labelledby="curve-h">
    <h2 id="curve-h">에폭별 학습 곡선</h2>
    <p class="sub">검증 값은 학습에 쓰지 않은 12,000장으로 측정합니다. 학습 값은 좋아지는데 검증 값이 멈추면 학습 데이터에만 맞춰지고 있다는 신호입니다.</p>
    <div class="legend" id="legend" style="margin-top:10px"></div>
    <div class="charts" style="margin-top:8px">
      <div class="chart"><h3>검증 정확도</h3><svg id="c-vacc" role="img" aria-label="모델별 에폭당 검증 정확도"></svg></div>
      <div class="chart"><h3>검증 손실</h3><svg id="c-vloss" role="img" aria-label="모델별 에폭당 검증 손실"></svg></div>
      <div class="chart"><h3>학습 정확도</h3><svg id="c-acc" role="img" aria-label="모델별 에폭당 학습 정확도"></svg></div>
      <div class="chart"><h3>학습 손실</h3><svg id="c-loss" role="img" aria-label="모델별 에폭당 학습 손실"></svg></div>
    </div>
  </section>
</template>

<script>
(function () {
  'use strict';
  const $ = id => document.getElementById(id);
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const pct = (v, d = 2) => (v * 100).toFixed(d) + '%';
  const fmt = n => n.toLocaleString('ko-KR');

  function lineChart(svg, series, fmtY) {
    const W = svg.clientWidth || 400, H = 190, L = 48, R = 10, T = 8, B = 22;
    const all = series.flatMap(s => s.values);
    let lo = Math.min(...all), hi = Math.max(...all);
    const pad = (hi - lo) * 0.12 || 0.01; lo -= pad; hi += pad;
    const n = Math.max(...series.map(s => s.values.length));
    const x = i => L + (W - L - R) * (n === 1 ? 0.5 : i / (n - 1));
    const y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
    let out = '';
    for (let k = 0; k <= 4; k++) {
      const v = lo + (hi - lo) * k / 4, yy = y(v);
      out += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="${css('--rule')}"/>` +
             `<text x="${L - 8}" y="${yy + 4}" text-anchor="end">${fmtY(v)}</text>`;
    }
    for (let i = 0; i < n; i++) out += `<text x="${x(i)}" y="${H - 4}" text-anchor="middle">${i + 1}에폭</text>`;
    series.forEach(s => {
      out += `<polyline points="${s.values.map((v, i) => `${x(i)},${y(v)}`).join(' ')}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round"/>`;
      s.values.forEach((v, i) => {
        out += `<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="${css('--panel')}" stroke="${s.color}" stroke-width="2"><title>${s.name} ${i + 1}에폭: ${fmtY(v, true)}</title></circle>`;
      });
    });
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.innerHTML = out;
  }

  function render(R) {
    const C = (R.compare || []).slice().sort((a, b) => a.hidden - b.hidden);
    if (C.length < 2) {
      const s = $('state'); s.textContent = '비교 결과가 아직 없습니다. GitHub Actions가 다음 학습을 마치면 표시됩니다.';
      return;
    }
    $('state').remove();
    $('app').appendChild($('tpl').content.cloneNode(true));
    const main = R.config.hidden;
    // MNIST 페이지의 모델은 파란색, 나머지는 작은 쪽부터 주황·보라·초록
    const others = [css('--orange'), css('--violet'), css('--ok'), css('--warn')];
    let oi = 0;
    const color = C.map(c => c.hidden === main ? css('--blue') : others[oi++ % others.length]);
    const cfg = R.config;
    const when = R.run.trained_at ? new Date(R.run.trained_at).toLocaleString('ko-KR', { dateStyle: 'medium', timeStyle: 'short' }) : '';
    $('meta').textContent = `에폭 ${cfg.epochs} · 배치 크기 ${cfg.batch_size} · TensorFlow ${R.run.tensorflow}` + (when ? ` · ${when} 학습` : '');
    if (R.run.run_url) $('run-link').href = R.run.run_url;
    $('foot').innerHTML = `이 결과는 GitHub Actions가 <a href="https://github.com/sunbaklee/deep-learning/blob/main/mnist/mnist_mlp.py">mnist_mlp.py</a>를 <code>--compare</code> 옵션으로 실행해 만든 것입니다.` +
      (R.run.commit ? ` 커밋 <code>${R.run.commit}</code>.` : '');

    const best = Math.max(...C.map(c => c.test.accuracy));
    $('models').innerHTML = C.map((c, i) => `
      <article class="panel model" style="--c:${color[i]}">
        <div class="tag"><h2>은닉층 ${c.hidden}개</h2>${c.hidden === main ? '<span>MNIST 실습의 모델</span>' : c.test.accuracy === best ? '<span>정확도 1위</span>' : ''}</div>
        <div class="acc">${pct(c.test.accuracy)}<small>테스트 정확도</small></div>
        <dl>
          <div><dt>파라미터</dt><dd>${fmt(c.params)}</dd></div>
          <div><dt>틀린 이미지</dt><dd>${fmt(c.test.wrong)}장</dd></div>
          <div><dt>학습 시간</dt><dd>${c.train_seconds}초</dd></div>
        </dl>
      </article>`).join('');

    // 이전 단계 대비 변화
    const ratio = (a, b) => `×${(b / a).toFixed(1)}`;
    $('gain-rows').innerHTML = C.map((c, i) => {
      const p = C[i - 1];
      const d = p ? (c.test.accuracy - p.test.accuracy) * 100 : null;
      const cls = d == null ? '' : d > 0.2 ? 'up' : d < 0 ? 'down' : 'flat';
      return `<tr><td><b style="color:${color[i]}">●</b> ${p ? `${p.hidden}개 → ` : ''}<b>${c.hidden}개</b></td>` +
        `<td class="num">${fmt(c.params)}${p ? ` <small>(${ratio(p.params, c.params)})</small>` : ''}</td>` +
        `<td class="num">${c.train_seconds}초${p ? ` <small>(${ratio(p.train_seconds, c.train_seconds)})</small>` : ''}</td>` +
        `<td class="num">${pct(c.test.accuracy)}${d == null ? '' : ` <span class="gain ${cls}">${d >= 0 ? '+' : ''}${d.toFixed(2)}%p</span>`}</td>` +
        `<td class="num">${fmt(c.test.wrong)}장</td></tr>`;
    }).join('');
    const steps = C.slice(1).map((c, i) => ({ from: C[i], to: c, d: (c.test.accuracy - C[i].test.accuracy) * 100 }));
    const first = steps[0], lastS = steps[steps.length - 1];
    $('takeaway').innerHTML = steps.length > 1
      ? `${first.from.hidden}개에서 ${first.to.hidden}개로 늘렸을 때는 정확도가 <b>${first.d >= 0 ? '+' : ''}${first.d.toFixed(2)}%p</b> 바뀌었고, ` +
        `${lastS.from.hidden}개에서 ${lastS.to.hidden}개로 늘렸을 때는 <b>${lastS.d >= 0 ? '+' : ''}${lastS.d.toFixed(2)}%p</b> 바뀌었습니다. ` +
        (Math.abs(lastS.d) < Math.abs(first.d) / 3 ? '뉴런을 늘릴수록 파라미터와 학습 시간은 계속 늘지만, 정확도가 오르는 폭은 줄어듭니다.' : '')
      : `${first.from.hidden}개에서 ${first.to.hidden}개로 늘리면 정확도가 <b>${first.d >= 0 ? '+' : ''}${first.d.toFixed(2)}%p</b> 바뀝니다.`;

    $('legend').innerHTML = C.map((c, i) => `<span style="color:${color[i]}"><i></i><b>은닉층 ${c.hidden}개</b></span>`).join('');
    const accF = (v, full) => (v * 100).toFixed(full ? 2 : 1) + '%', lossF = (v, full) => v.toFixed(full ? 4 : 3);
    const draw = () => {
      const S = key => C.map((c, i) => ({ name: `은닉층 ${c.hidden}개`, values: c.history[key], color: color[i] }));
      lineChart($('c-vacc'), S('val_accuracy'), accF);
      lineChart($('c-vloss'), S('val_loss'), lossF);
      lineChart($('c-acc'), S('accuracy'), accF);
      lineChart($('c-loss'), S('loss'), lossF);
    };
    draw();
    let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(draw, 150); });
  }

  fetch('../mnist/data/results.json').then(r => r.ok ? r.json() : Promise.reject())
    .then(render)
    .catch(() => {
      const s = $('state');
      if (!s) return;
      s.classList.add('err');
      s.textContent = '학습 결과를 불러오지 못했습니다. GitHub Actions의 학습이 끝난 뒤 새로고침하십시오.';
    });
})();
</script>
</body>
</html>
